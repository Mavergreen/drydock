name: release

# Cross-builds the x86_64/10.9 tools on a modern runner and proves the result is
# equivalent to a native 10.9 build. Entry points:
#   - push to main / PR to main: build + gate, never publish (the PR build is the
#     status check Renovate automerge waits on)
#   - workflow_dispatch with release=true, on main: build, sign, then publish the .pkg and
#     its feed as a GitHub Release through shipyard's publish-release.yml. Dispatch-only, because
#     this repo is its own upstream -- there is no external bump to auto-cut on, so a
#     release is deliberate
#
# There is no 10.9 runner here, or anywhere in the family. What makes that safe
# is the "Prove build equivalence" step below, not optimism.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]          # the status check Renovate automerge waits on
  workflow_dispatch:
    inputs:
      release:
        description: Publish v<UPSTREAM_VERSION> as a GitHub Release (main only)
        type: boolean
        default: false

permissions:
  contents: read

# Only a pull_request supersedes -- keyed per ref, so a force-push replaces its own predecessor.
# Everything else (a branch push, a dispatch) is keyed per RUN and is therefore alone in its
# group: never queued, never evicted, never cancelled.
#
# cancel-in-progress:false was never the protection it looked like: it protects the RUNNING job and
# not the QUEUED one -- GitHub keeps only the newest pending run per group and cancels the rest -- so
# the old shared group discarded runs silently. golang lost one on 2026-09-09, 13 seconds after the
# run that evicted it.
#
# This repo publishes only by dispatch, but keeps the family's one shape: most of the family's
# product repos auto-cut on a push to main, and a rule that holds only in some of them is a rule
# nobody can apply from memory.
concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request'
                && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: macos-26   # Apple Silicon; cross-builds the x86_64/10.9 slice. Use macos-15 if 26 is unavailable.
    outputs:
      version: ${{ steps.ver.outputs.full }}
      tag: ${{ steps.ver.outputs.tag }}
      publish: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the notes generator refuses a shallow clone

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      - name: Verify shipyard installed
        run: |
          [ -d "$SHIPYARD_SCRIPTS" ] || { echo "::error::SHIPYARD_SCRIPTS not set by install@v1"; exit 1; }
          echo "shipyard scripts: $SHIPYARD_SCRIPTS"

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      - name: Locate the out-of-tree build the preset will use
        # platform: shipyard's mavericks-* hidden presets pin their own
        # environment.MAVERICKS_BUILD_ROOT to $penv{TMPDIR}/mm-build, and CMake applies a
        # preset's own environment table after anything exported here -- so an export
        # cannot redirect a --preset build. Derive the path instead of setting it. A child
        # preset CAN re-declare the variable from $penv to win, but then an unset variable
        # breaks a fresh clone (binaryDir expands to "/macho-tools-native", which CMake
        # refuses as unwritable), so we do not.
        run: echo "CROSS_BUILD_DIR=${TMPDIR:-/tmp}/mm-build/$(basename "$PWD")-cross" >> "$GITHUB_ENV"

      # Nothing external to derive from -- this repo is its own upstream -- so the version
      # IS UPSTREAM_VERSION, hand-bumped, and the tag is v plus that, so the two cannot
      # disagree. Computed here rather than through shipyard's version.sh or
      # resolve-version.sh: both only ever emit the <upstream>-mavericks.N shape a PORT
      # needs, which is exactly the suffix this repo does not carry. mavericks-porthole,
      # the family's other self-upstream repo, computes inline for the same reason.
      - name: Version (vX.Y.Z) + publish decision
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          WANT_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main' }}
        run: |
          set -eu
          full="$(tr -d '[:space:]' < UPSTREAM_VERSION)"
          tag="v$full"
          rel=no
          if [ "$WANT_RELEASE" = true ]; then
            err="$(mktemp)"
            if gh release view "$tag" > /dev/null 2> "$err"; then
              echo "::error::release $tag already exists -- bump UPSTREAM_VERSION to publish a new one"
              exit 1
            fi
            grep -q 'release not found' "$err" || {
              echo "::error::could not tell whether release $tag exists: $(cat "$err")"
              exit 1
            }
            rel=yes
          fi
          printf '%s\n' "$full" > VERSION
          { echo "full=$full"; echo "tag=$tag"; echo "release=$rel"; } >> "$GITHUB_OUTPUT"
          echo "version=$full tag=$tag release=$rel"

      # The cross preset asserts it is NOT on 10.9 and pins CMAKE_OSX_SYSROOT to
      # the fetched 10.9 SDK. Building against the runner's own SDK with only
      # -mmacosx-version-min=10.9 would accept declarations 10.9 never had.
      - name: Configure (cross, against the pinned 10.9 SDK, with the updater)
        run: shipyard-cmake --preset cross -DDRYDOCK_BUILD_UPDATER=ON

      # Every tool is gated POST_BUILD by shipyard's compat guard: fails if a
      # binary declares a floor above 10.9 or imports a symbol 10.9 lacks.
      - name: Build + compat guard
        run: shipyard-cmake --build --preset cross

      # family_conventions runs shipyard's conventions gate, whose workflow-parse
      # check needs PyYAML; the runner's python3 has none, and install@v1 does
      # not provision it. setup-python, so pip is not PEP 668 externally-managed.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Provision PyYAML (family_conventions' dependency)
        run: python3 -m pip install --quiet pyyaml && python3 -c 'import yaml; print("PyYAML", yaml.__version__)'

      # The shared runner takes the whole suite, so a newly added test runs the
      # day it lands rather than when someone remembers a CI line. Includes
      # `characterize`, which is the equivalence gate.
      - name: Run the repo's tests
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh" cross

      # Stated separately so a failure reads as what it is. tests/EXPECTED was
      # recorded from a NATIVE build on real 10.9 hardware; this compares the
      # cross build's pipeline output against it. Matching digests are the claim
      # "cross ≡ native" made checkable. These tools are deterministic file
      # transformers, and a cross-built tool is x86_64 with a 10.9 FLOOR -- so it
      # still runs on this runner, which is what lets CI execute what it built.
      # Run separately as well as under ctest. ctest hides a skipped test's
      # output, so a SKIP here would be indistinguishable from a pass -- exactly
      # the silent no-op this test exists to avoid. On a modern runner it must
      # actually run; a skip is a failure of the check, not of the tools.
      - name: Cover patch_macho's chained-fixups conversion
        run: |
          set -eu
          sh tests/chained-fixups.sh "$CROSS_BUILD_DIR" && rc=0 || rc=$?
          if [ "$rc" = 77 ]; then
            echo "::error::chained-fixups SKIPPED on a modern runner — it should be able to emit them"
            exit 1
          fi
          exit "$rc"

      # The same reasoning as chained-fixups above: this runner is the arm64 Mac with
      # Rosetta that the test needs, so a SKIP here means it measured nothing.
      - name: Edited outputs on Apple Silicon (strip or re-sign, by arch)
        run: |
          set -eu
          sh tests/apple_silicon_signing_test.sh "$CROSS_BUILD_DIR" && rc=0 || rc=$?
          if [ "$rc" = 77 ]; then
            echo "::error::apple_silicon_signing_test SKIPPED on the arm64 runner -- it should run here"
            exit 1
          fi
          exit "$rc"

      - name: Prove build equivalence against the native 10.9 reference
        run: |
          set -eu
          echo "reference digest (recorded natively on 10.9): $(cat tests/EXPECTED)"
          sh tests/characterize.sh "$CROSS_BUILD_DIR" check

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

      # The .pkg installs the tools by the build's own install rules, under
      # /usr/local/mavergreen/drydock, with the updater; installed_layout_test has
      # already run those same files through a farm of symlinks, and the payload
      # test below proves the package carries exactly them.
      - name: Package the .pkg
        run: |
          set -eu
          sh packaging/build-pkg.sh "$CROSS_BUILD_DIR" '${{ steps.ver.outputs.full }}' \
            "$CROSS_BUILD_DIR/dist/drydock-${{ steps.ver.outputs.full }}.pkg"

      - name: The package installs exactly what was tested
        run: |
          sh tests/pkg_payload_test.sh "$CROSS_BUILD_DIR/dist/drydock-${{ steps.ver.outputs.full }}.pkg" \
            "$(command -v shipyard-cmake)" "$CROSS_BUILD_DIR"

      # The Release body travels IN the artifact: publish-release.yml never checks this
      # repo out, and it refuses an empty body. Generated on every run rather than only a
      # publishing one, so a broken notes pipeline costs a pull request instead of a release.
      - name: Collect the release-notes body into the artifact
        run: |
          set -eu
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" \
            --tag '${{ steps.ver.outputs.tag }}' --version '${{ steps.ver.outputs.full }}' \
            --product Drydock --min-os 10.9.5 --out "$CROSS_BUILD_DIR/dist/RELEASE_NOTES.md"
          echo "=== RELEASE_NOTES.md ==="; cat "$CROSS_BUILD_DIR/dist/RELEASE_NOTES.md"

      - name: Unsigned stand-in feeds (never published)
        if: steps.ver.outputs.release != 'yes'
        run: sh "$SHIPYARD_SCRIPTS/stand-in-feeds.sh" "$CROSS_BUILD_DIR/dist" '${{ steps.ver.outputs.full }}'

      - name: EdDSA-sign the .pkg + write drydock.xml
        if: steps.ver.outputs.release == 'yes'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          VER='${{ steps.ver.outputs.full }}'
          TAG='${{ steps.ver.outputs.tag }}'
          PKG="$CROSS_BUILD_DIR/dist/drydock-$VER.pkg"
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" \
            --product drydock --feed-dir "$CROSS_BUILD_DIR/dist" \
            --channel-title Drydock --version "$VER" \
            --pkg-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$(basename "$PKG")" \
            --notes-file "$CROSS_BUILD_DIR/dist/RELEASE_NOTES.md" --pkg "$PKG" --min-os 10.9.5

      # Every run, against the stand-in feed when not releasing, so a pull request finds
      # what a release would. The vX.Y.Z scheme is a DECLARED deviation (INGREDIENTS.md) --
      # the shared check hard-requires <upstream>-mavericks.N and has no self-upstream
      # exemption -- which is what this step reads that declaration for.
      - name: Artifact conformance
        run: |
          sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" "$CROSS_BUILD_DIR/dist" "${{ steps.ver.outputs.full }}" \
            | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"

      - name: The feed is an upgrade on its line
        if: steps.ver.outputs.release == 'yes'
        run: |
          sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast "$CROSS_BUILD_DIR/dist/drydock.xml" \
            --version '${{ steps.ver.outputs.tag }}' --tag-glob 'v*.*.*'

      - uses: actions/upload-artifact@v7
        with:
          name: drydock
          path: ${{ env.CROSS_BUILD_DIR }}/dist/*

  # Proves this run's logs and files carry no piece of the signing key, before anything
  # publishes; always(), so a run that failed after signing is scanned too.
  scan:
    needs: [build]
    if: always() && (needs.build.outputs.publish == 'yes')
    permissions:
      actions: read
      contents: read
    uses: Mavergreen/shipyard/.github/workflows/scan-for-key.yml@v1
    with:
      artifact: drydock
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  # The only writer to Releases, and only a dispatch on main reaches it: nothing else sets release=yes.
  # The shared workflow regenerates SHA256SUMS, uses RELEASE_NOTES.md from the artifact as the
  # Release body, and fails if those notes are missing or empty.
  publish:
    needs: [build, scan]
    if: needs.build.outputs.publish == 'yes'
    permissions:
      contents: write
    uses: Mavergreen/shipyard/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.build.outputs.tag }}
      artifact: drydock
