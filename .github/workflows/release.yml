name: release

# Cross-builds the tools twice on Linux with clang22, x86_64 at a 10.9 floor and arm64
# at 11.0, and ships them merged into one universal .pkg. The modern-smoke job installs
# the .pkg on Apple Silicon and runs arm64 only; x86_64 runs natively on Mac OS X 10.9,
# in the on-target job, which installs the .pkg there and builds and tests the native
# preset. Entry points:
#   - push to main / PR to main: build + gate, never publish (the PR build is the
#     status check Renovate automerge waits on)
#   - workflow_dispatch with release=true, on main: build, sign, then publish the .pkg and
#     its feed as a GitHub Release through shipyard's publish-release.yml. Dispatch-only, because
#     this repo is its own upstream -- there is no external bump to auto-cut on, so a
#     release is deliberate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]          # the status check Renovate automerge waits on
  workflow_dispatch:
    inputs:
      release:
        description: Publish v<UPSTREAM_VERSION> as a GitHub Release (main only)
        type: boolean
        default: false

permissions:
  contents: read

# Only a pull_request supersedes -- keyed per ref, so a force-push replaces its own predecessor.
# Everything else (a branch push, a dispatch) is keyed per RUN and is therefore alone in its
# group: never queued, never evicted, never cancelled.
#
# cancel-in-progress:false was never the protection it looked like: it protects the RUNNING job and
# not the QUEUED one -- GitHub keeps only the newest pending run per group and cancels the rest -- so
# the old shared group discarded runs silently. golang lost one on 2026-09-09, 13 seconds after the
# run that evicted it.
#
# This repo publishes only by dispatch, but keeps the family's one shape: most of the family's
# product repos auto-cut on a push to main, and a rule that holds only in some of them is a rule
# nobody can apply from memory.
concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request'
                && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest   # cross-builds both slices with clang22 and packages them; modern-smoke and on-target run them
    outputs:
      version: ${{ steps.ver.outputs.full }}
      tag: ${{ steps.ver.outputs.tag }}
      publish: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the notes generator refuses a shallow clone

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      - name: Verify shipyard installed
        run: |
          [ -d "$SHIPYARD_SCRIPTS" ] || { echo "::error::SHIPYARD_SCRIPTS not set by install@v1"; exit 1; }
          echo "shipyard scripts: $SHIPYARD_SCRIPTS"

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      - name: Locate the out-of-tree build the preset will use
        # platform: shipyard's mavericks-* hidden presets pin their own
        # environment.MAVERICKS_BUILD_ROOT to $penv{TMPDIR}/mm-build, and CMake applies a
        # preset's own environment table after anything exported here -- so an export
        # cannot redirect a --preset build. Derive the path instead of setting it. A child
        # preset CAN re-declare the variable from $penv to win, but then an unset variable
        # breaks a fresh clone (binaryDir expands to "/macho-tools-native", which CMake
        # refuses as unwritable), so we do not.
        run: |
          echo "CROSS_BUILD_DIR=${TMPDIR:-/tmp}/mm-build/$(basename "$PWD")-cross" >> "$GITHUB_ENV"
          echo "ARM64_BUILD_DIR=${TMPDIR:-/tmp}/mm-build/$(basename "$PWD")-cross-arm64" >> "$GITHUB_ENV"

      # Nothing external to derive from -- this repo is its own upstream -- so the version
      # IS UPSTREAM_VERSION, hand-bumped, and the tag is v plus that, so the two cannot
      # disagree. Computed here rather than through shipyard's version.sh or
      # resolve-version.sh: both only ever emit the <upstream>-mavericks.N shape a PORT
      # needs, which is exactly the suffix this repo does not carry. mavericks-porthole,
      # the family's other self-upstream repo, computes inline for the same reason.
      - name: Version (vX.Y.Z) + publish decision
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          WANT_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main' }}
        run: |
          set -eu
          full="$(tr -d '[:space:]' < UPSTREAM_VERSION)"
          tag="v$full"
          rel=no
          if [ "$WANT_RELEASE" = true ]; then
            err="$(mktemp)"
            if gh release view "$tag" > /dev/null 2> "$err"; then
              echo "::error::release $tag already exists -- bump UPSTREAM_VERSION to publish a new one"
              exit 1
            fi
            grep -q 'release not found' "$err" || {
              echo "::error::could not tell whether release $tag exists: $(cat "$err")"
              exit 1
            }
            rel=yes
          fi
          printf '%s\n' "$full" > VERSION
          { echo "full=$full"; echo "tag=$tag"; echo "release=$rel"; } >> "$GITHUB_OUTPUT"
          echo "version=$full tag=$tag release=$rel"

      # The cross preset asserts it is NOT on 10.9 and pins CMAKE_OSX_SYSROOT to
      # the fetched 10.9 SDK, so no declaration 10.9 never had is accepted.
      - name: Configure (cross, against the pinned 10.9 SDK, with the updater)
        run: shipyard-cmake --preset cross -DDRYDOCK_BUILD_UPDATER=ON

      # Every tool is gated POST_BUILD by shipyard's compat guard: fails if a
      # binary declares a floor above 10.9 or imports a symbol 10.9 lacks.
      - name: Build + compat guard
        run: shipyard-cmake --build --preset cross

      # The arm64 slice: a second configure, because a deployment floor is per-configure and
      # arm64 has no 10.9. shipyard's toolchain pins the 11.3 SDK and an 11.0 floor, and the
      # compat guard holds each binary to that.
      - name: Configure + build + compat guard (cross-arm64, against the pinned 11.3 SDK, with the updater)
        run: |
          set -eu
          shipyard-cmake --preset cross-arm64 -DDRYDOCK_BUILD_UPDATER=ON
          shipyard-cmake --build --preset cross-arm64

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

      # The .pkg installs the tools by each build's own install rules, merged into one
      # universal tree under /usr/local/mavergreen/drydock, with the two updaters merged
      # the same way; the payload test below proves the package carries exactly them,
      # both slices in every Mach-O.
      - name: Package the .pkg
        run: |
          set -eu
          sh packaging/build-pkg.sh "$CROSS_BUILD_DIR" "$ARM64_BUILD_DIR" '${{ steps.ver.outputs.full }}' \
            "$CROSS_BUILD_DIR/dist/drydock-${{ steps.ver.outputs.full }}.pkg"

      - name: The package installs exactly what was tested
        run: |
          sh tests/pkg_payload_test.sh "$CROSS_BUILD_DIR/dist/drydock-${{ steps.ver.outputs.full }}.pkg" \
            "$(command -v shipyard-cmake)" "$CROSS_BUILD_DIR" "$ARM64_BUILD_DIR"

      - name: Package the standalone archive
        run: |
          sh packaging/build-standalone.sh "$CROSS_BUILD_DIR" "$ARM64_BUILD_DIR" '${{ steps.ver.outputs.full }}' \
            "$CROSS_BUILD_DIR/dist/drydock-${{ steps.ver.outputs.full }}-macos-universal.tar.gz"

      # platform: Linux runs no Mach-O, so here it checks the archive's tree; modern-smoke runs its tools.
      - name: The standalone archive is the package's tree
        run: |
          sh tests/standalone_archive_test.sh \
            "$CROSS_BUILD_DIR/dist/drydock-${{ steps.ver.outputs.full }}-macos-universal.tar.gz" \
            "$CROSS_BUILD_DIR/dist/drydock-${{ steps.ver.outputs.full }}.pkg"

      # The inputs need a clang22 that builds arm64, which the 10.9 guest lacks: on-target and modern-smoke
      # make their outputs from these same inputs, and the equivalence job compares the three.
      # platform: drydock's objc-receipt-clang pin ships no llvm-libtool-darwin for Linux; shipyard's clang22 does.
      - name: Equivalence inputs
        run: |
          set -eu
          CL="$(sh "$SHIPYARD_SCRIPTS/fetch_clang22.sh" "$SHIPYARD_SCRIPTS/../components/clang22")"
          CLANG22="$CL" sh tests/equivalence.sh inputs "$RUNNER_TEMP/equivalence/inputs"

      - uses: actions/upload-artifact@v7
        with:
          name: drydock-equivalence
          path: ${{ runner.temp }}/equivalence

      # The Release body travels IN the artifact: publish-release.yml never checks this
      # repo out, and it refuses an empty body. Generated on every run rather than only a
      # publishing one, so a broken notes pipeline costs a pull request instead of a release.
      - name: Collect the release-notes body into the artifact
        run: |
          set -eu
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" \
            --tag '${{ steps.ver.outputs.tag }}' --version '${{ steps.ver.outputs.full }}' \
            --product Drydock --min-os 10.9.5 --out "$CROSS_BUILD_DIR/dist/RELEASE_NOTES.md"
          echo "=== RELEASE_NOTES.md ==="; cat "$CROSS_BUILD_DIR/dist/RELEASE_NOTES.md"

      - name: Unsigned stand-in feeds (never published)
        if: steps.ver.outputs.release != 'yes'
        run: sh "$SHIPYARD_SCRIPTS/stand-in-feeds.sh" "$CROSS_BUILD_DIR/dist" '${{ steps.ver.outputs.full }}'

      - name: EdDSA-sign the .pkg + write drydock.xml
        if: steps.ver.outputs.release == 'yes'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          VER='${{ steps.ver.outputs.full }}'
          TAG='${{ steps.ver.outputs.tag }}'
          PKG="$CROSS_BUILD_DIR/dist/drydock-$VER.pkg"
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" \
            --product drydock --feed-dir "$CROSS_BUILD_DIR/dist" \
            --channel-title Drydock --version "$VER" \
            --pkg-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$(basename "$PKG")" \
            --notes-file "$CROSS_BUILD_DIR/dist/RELEASE_NOTES.md" --pkg "$PKG" --min-os 10.9.5

      # Every run, against the stand-in feed when not releasing, so a pull request finds
      # what a release would. The vX.Y.Z scheme is a DECLARED deviation (INGREDIENTS.md) --
      # the shared check hard-requires <upstream>-mavericks.N and has no self-upstream
      # exemption -- which is what this step reads that declaration for.
      - name: Artifact conformance
        run: |
          sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" "$CROSS_BUILD_DIR/dist" "${{ steps.ver.outputs.full }}" \
            | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"

      - name: The feed is an upgrade on its line
        if: steps.ver.outputs.release == 'yes'
        run: |
          sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast "$CROSS_BUILD_DIR/dist/drydock.xml" \
            --version '${{ steps.ver.outputs.tag }}' --tag-glob 'v*.*.*'

      - uses: actions/upload-artifact@v7
        with:
          name: drydock
          path: ${{ env.CROSS_BUILD_DIR }}/dist/*

  linux:
    name: build (linux-x86_64)
    runs-on: ubuntu-latest
    container: ubuntu:26.04@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db
    steps:
      - name: The image's toolchain
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates git curl xz-utils bzip2 cpio perl gcc libc6-dev make cmake binutils python3 python3-yaml bats

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Trust the checkout, which the runner's user owns
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      - name: Out of tree
        run: |
          echo "LINUX_BUILD_DIR=$RUNNER_TEMP/mm-build/drydock-linux" >> "$GITHUB_ENV"
          echo "LINUX_DIST=$RUNNER_TEMP/dist-linux" >> "$GITHUB_ENV"
          echo "VERSION_FULL=$(tr -d '[:space:]' < UPSTREAM_VERSION)" >> "$GITHUB_ENV"

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      - name: Configure + build for the x86-64 baseline
        run: |
          set -eu
          CM="$(command -v cmake)"
          "$CM" -S . -B "$LINUX_BUILD_DIR" -DCMAKE_C_FLAGS="-march=x86-64 -mtune=generic"
          "$CM" --build "$LINUX_BUILD_DIR" -j "$(nproc)"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/macfuse-debug
          key: macfuse-debug-${{ hashFiles('components/macfuse-debug/sha256') }}

      - name: Fetch and verify macFUSE's debug tarball, for macfuse_golden_test
        run: |
          set -eu
          v="$(tr -d '[:space:]' < components/macfuse-debug/version)"
          tbz="$HOME/.cache/macfuse-debug/macfuse-$v-debug.tbz"
          mkdir -p "$(dirname "$tbz")"
          [ -f "$tbz" ] || curl -fsSL -o "$tbz" "https://github.com/macfuse/macfuse/releases/download/macfuse-$v/macfuse-$v-debug.tbz"
          echo "$(tr -d '[:space:]' < components/macfuse-debug/sha256)  $tbz" | shasum -a 256 -c
          echo "MACFUSE_DEBUG_TBZ=$tbz" >> "$GITHUB_ENV"

      - name: Every test that does not need a Mac runs, and none skips
        run: |
          set -eu
          CT="$(command -v ctest)"
          rc=0
          "$CT" --test-dir "$LINUX_BUILD_DIR" --output-on-failure -LE macos-only -j "$(nproc)" \
            > "$RUNNER_TEMP/ctest.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/ctest.log"
          [ "$rc" -eq 0 ] || exit "$rc"
          if grep -q 'did not run' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test skipped on Linux without declaring that it needs macOS"
            exit 1
          fi

      - name: The tests that need a Mac, each skipped with its reason
        run: |
          set -eu
          CT="$(command -v ctest)"
          "$CT" --test-dir "$LINUX_BUILD_DIR" -L macos-only -V > "$RUNNER_TEMP/skips.log" 2>&1
          want="$("$CT" --test-dir "$LINUX_BUILD_DIR" -N -L macos-only | sed -n 's/^Total Tests: //p')"
          grep -E '^[0-9]+: SKIP .*: needs macOS: ' "$RUNNER_TEMP/skips.log" | sed 's/^[0-9]*: //' > "$RUNNER_TEMP/skips.txt"
          cat "$RUNNER_TEMP/skips.txt"
          got="$(wc -l < "$RUNNER_TEMP/skips.txt" | tr -d ' ')"
          [ -n "$want" ] && [ "$got" -eq "$want" ] || { echo "::error::$got of ${want:-?} macOS-only tests said why they skip"; exit 1; }

      - name: Package the Linux archive
        run: |
          set -eu
          sh packaging/build-linux.sh "$LINUX_BUILD_DIR" "$VERSION_FULL" \
            "$LINUX_DIST/drydock-$VERSION_FULL-linux-x86_64.tar.gz"
          cache() { sed -n "s/^$1:[A-Z]*=//p" "$LINUX_BUILD_DIR/CMakeCache.txt"; }
          # The archive's own bin/ is what ships, so it is what is measured: the highest ISA level and glibc
          # version over every ELF in it (drydock-macho-rewrite and drydock-objc both).
          probe="$(mktemp -d)"
          tar -xzf "$LINUX_DIST/drydock-$VERSION_FULL-linux-x86_64.tar.gz" -C "$probe"
          needs="$(sh packaging/elf-needs-all.sh "$probe/drydock-$VERSION_FULL/bin" | grep -v '^elf-count=')"
          rm -rf "$probe"
          sh "$SHIPYARD_SCRIPTS/build-info.sh" "$LINUX_DIST/build-info-linux-x86_64.txt" \
            variant=linux-x86_64 arch=x86_64 $needs \
            build-image="$(. /etc/os-release && echo "$PRETTY_NAME")" \
            build-cc="$("$(cache CMAKE_C_COMPILER)" --version | sed -n 1p)" \
            build-cmake="$("$(cache CMAKE_COMMAND)" --version | sed -n 1p)" \
            build-libc="$(ldd --version | sed -n 1p)"
          cat "$LINUX_DIST/build-info-linux-x86_64.txt"

      - name: The executable asks for no x86 ISA level above the x86-64 baseline
        run: grep -qx 'isa-needed=x86-64-baseline' "$LINUX_DIST/build-info-linux-x86_64.txt"

      - name: The Linux archive is the standalone tree, and runs from anywhere
        run: sh tests/linux_archive_test.sh "$LINUX_DIST/drydock-$VERSION_FULL-linux-x86_64.tar.gz"

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: drydock-linux
          path: ${{ env.LINUX_DIST }}/*

  # The x86_64 build, accepted where it runs: a Mac OS X 10.9.5 guest (Mavergreen/mavericks-vm). It
  # installs this run's .pkg and runs every tool it ships at the installed version, builds the native
  # preset and runs the suite with DRYDOCK_REQUIRE_EXEC=x86_64, so a row that would skip x86_64 fails,
  # then runs the suite again on the installed tools (DRYDOCK_TOOL_DIR), the clang22-built ones the
  # .pkg ships; it characterizes the native build and the installed tools, and makes equivalence's
  # macos-x86_64 outputs from the installed tools. A skipped x86_64 row fails its test there. A whole
  # test that does not run fails the job unless the guest's allow-list names it and its last SKIP line
  # gives the reason the list states, and so does a 77 from the scripts run outside ctest. Any other row
  # that says SKIP or N/A fails the job unless a second allow-list names it.
  #
  # The guest has no Command Line Tools, so no make (its /usr/bin/make is a stub): Mavergreen's make is
  # installed for CMake's Unix Makefiles generator. clang22 compiles the product (shipyard's AppleClang gate off)
  # and the fixtures, and its llvm-* stand in for otool, nm, lipo and strings. The pkgs and the 10.9
  # SDK are fetched and verified here and reach the guest with the workspace; only `longboat sdk
  # install 10.9` fetches in the guest.
  #
  # The suite is run-repo-tests.sh native with a label filter, which run-repo-tests.sh does not take.
  # -LE not-in-guest leaves out objc_reference_set and objc_iterm2_acceptance, maintainer tests that
  # fetch SDKs and an iTerm2 zip and insert into system processes for up to an hour, run by hand on
  # ultimate-hat; family_conventions, which checks repo policy, not x86_64 behaviour, and needs
  # python3 and PyYAML, which 10.9 lacks; exec_arch_sweep_test, jansson_pin_test, linux_pin_test,
  # no_superpowers_citations_test and rosetta_free_test, which need git,
  # and 10.9's git is a Command Line Tools stub (the runner and Linux run those); and mantle_raise_test, whose
  # subject is an app in one maintainer's ~/Downloads, so it runs on that Mac alone; and objc_attest_codex,
  # whose input is codex's kept repro in that maintainer's ~/Library/Caches; and resources_instantiate, which
  # instantiates converted nibs with AppKit and may need a window server session the guest's ctest lacks (unverified;
  # run on 10.9 by hand); and resources_macfuse_pane, whose input is macFUSE's pane nib, which a maintainer names in
  # DRYDOCK_RESOURCES_MACFUSE_NIB.
  on-target:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write   # mavericks-vm's shared image cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: drydock
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: drydock-equivalence
          path: eq

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      # On Linux, install@v1 installs nothing and leaves SHIPYARD_SCRIPTS in its own checkout, whose
      # components/cmake/version is the cmake its shipyard pkg requires.
      - name: Stage shipyard's scripts, Longboat, make, cmake, shipyard, clang22, libcxx22, legacy-support and the 10.9 SDK
        run: |
          set -eu
          cp -R "$SHIPYARD_SCRIPTS" .shipyard-scripts
          fetch() { sh "$SHIPYARD_SCRIPTS/fetch-release-pkg.sh" "$@" deps; }
          lb="$(tr -d '[:space:]' < components/longboat/version)"
          fetch longboat "$lb" "longboat-$lb.pkg"
          mk="$(tr -d '[:space:]' < components/make/version)"
          fetch make "$mk" "make-$mk.pkg"
          cm="$(tr -d '[:space:]' < "$SHIPYARD_SCRIPTS/../components/cmake/version")"
          fetch cmake "$cm" "cmake-$cm.pkg"
          sv="${SHIPYARD_VERSION:?install@v1 named no shipyard release}"
          fetch shipyard "v$sv" "mavericks-shipyard-$sv.pkg"
          c="$(tr -d '[:space:]' < components/objc-receipt-clang/version)"
          fetch clang-22 "$c" "mavericks-clang-22-native-$c.pkg"
          fetch clang-22 "$c" "libcxx22-$c.pkg"
          mls="$(tr -d '[:space:]' < components/macports-legacy-support/version)"
          fetch recaulk "$mls" "macports-legacy-support-$mls.pkg"
          MAVERICKS_SDK_CACHE="$PWD/deps/mavericks-sdk" sh "$SHIPYARD_SCRIPTS/fetch_sdk.sh" --arch x86_64
          ls dist deps eq

      - name: On Mac OS X 10.9, install the .pkg and run its tools, then build, test and characterize natively
        uses: Mavergreen/mavericks-vm@v1
        with:
          image-key: ${{ secrets.MAVERICKS_VM_KEY }}
          cpu: '4'
          mem: '8192'
          run: |
            sw_vers
            sudo -n true || { echo "the guest's user cannot sudo without a password, and installer needs root"; exit 1; }
            for p in deps/longboat-*.pkg; do sudo installer -pkg "$p" -target /; done
            sudo /usr/local/mavergreen/longboat/bin/longboat sdk install 10.9
            for p in deps/mavericks-clang-22-native-*.pkg deps/libcxx22-*.pkg deps/make-*.pkg deps/cmake-*.pkg deps/mavericks-shipyard-*.pkg; do
              sudo installer -pkg "$p" -target /
            done
            must() { status=0; "$@" || status=$?; [ "$status" -eq 0 ] || { echo "$* exited $status (77, a skip, is a failure here)"; exit 1; }; }
            I=/usr/local/mavergreen
            export PATH="$I/bin:$PATH" SHIPYARD_SCRIPTS="$PWD/.shipyard-scripts" MAVERICKS_SDK_CACHE="$PWD/deps/mavericks-sdk"
            export CLANG22=$I/clang22
            export NM=$CLANG22/bin/llvm-nm OTOOL=$CLANG22/bin/llvm-otool LIPO=$CLANG22/bin/llvm-lipo STRINGS=$CLANG22/bin/llvm-strings
            TMPDIR="${TMPDIR:-$(getconf DARWIN_USER_TEMP_DIR)}"; export TMPDIR

            V='${{ needs.build.outputs.version }}'
            sudo installer -pkg "dist/drydock-$V.pkg" -target /
            got="$(/usr/libexec/PlistBuddy -c 'Print :version' "$I/drydock/mavergreen.plist")"
            [ "$got" = "$V" ] || { echo "the installed manifest says version $got, not $V"; exit 1; }
            INSTALLED=$I/drydock/bin
            # No tool takes --version. Run bare, each must start and answer with its usage.
            for f in "$INSTALLED"/*; do
              rc=0; "$f" < /dev/null > "$TMPDIR/bare.out" 2>&1 || rc=$?
              case "$rc" in 1|2) [ -s "$TMPDIR/bare.out" ] || { echo "$f exited $rc saying nothing"; exit 1; } ;;
                *) cat "$TMPDIR/bare.out"; echo "$f, run bare, exited $rc"; exit 1 ;; esac
              echo "ran $f ($rc, its usage)"
            done
            must "$INSTALLED/drydock-macho-rewrite" --capabilities > /dev/null

            # legacysupport_rename_test's MacPorts library, unpacked rather than installed.
            mls="$TMPDIR/macports-legacy-support" pkg="$(ls "$PWD"/deps/macports-legacy-support-*.pkg)"
            mkdir -p "$mls" && (cd "$mls" && xar -xf "$pkg" && gzip -dc macports-legacy-support-component.pkg/Payload | cpio -id 2>/dev/null) || exit 1
            export LEGACYSUPPORT_A="$mls/usr/local/mavergreen/legacysupport/lib/libMacportsLegacySupport.a"
            [ -f "$LEGACYSUPPORT_A" ] || { echo "$pkg holds no usr/local/mavergreen/legacysupport/lib/libMacportsLegacySupport.a"; exit 1; }

            shipyard-cmake --preset native -DMAVERICKS_REQUIRE_APPLECLANG=OFF -DCMAKE_C_COMPILER="$CLANG22/bin/clang" \
              -DCMAKE_AR="$CLANG22/bin/llvm-ar" -DCMAKE_RANLIB="$CLANG22/bin/llvm-ranlib" \
              -DCMAKE_INSTALL_NAME_TOOL="$CLANG22/bin/llvm-install-name-tool" -DDRYDOCK_CLANG22="$CLANG22"
            shipyard-cmake --build --preset native
            NATIVE="$TMPDIR/mm-build/$(basename "$PWD")-native"
            # Allowed not to run here, each only for the reason its last SKIP line must give:
            #   x86len_oracle_test: its oracle is cctools' otool, which needs the Command Line Tools
            #   rebase_oracle_test: its oracle is the Command Line Tools' dyldinfo
            #   apple_silicon_signing_test: it measures arm64 on Apple Silicon; modern-smoke runs it
            #   macfuse_golden_test: the guest is handed no macFUSE tarball; the modern-smoke and linux jobs fetch it and run it
            why() {
              case "$1" in
                x86len_oracle_test) echo "SKIP: no cctools otool here" ;;
                rebase_oracle_test) echo "SKIP: no dyldinfo here" ;;
                apple_silicon_signing_test) echo "SKIP: cannot execute arm64 on this host" ;;
                macfuse_golden_test) echo "SKIP: macfuse_golden_test: no MACFUSE_DEBUG_TBZ" ;;
                *) return 1 ;;
              esac
            }
            # Rows of tests that ran, allowed to say SKIP or N/A here, each by its name, for the reason given:
            #   bake_mavericks_shim_test N/A signed, codesign_order_test N/A resign, insert_dylib_test SKIP --strip-codesig
            #     and SKIP no tty: the guest has no codesign_allocate, so codesign -s - cannot sign
            #   fixture_toolchain_test N/A positive control: 10.9's git is a stub; the runner and Linux run them
            #   objc_report SKIP no x86_64 slice, symbol_rename_test SKIP arm64: the native clang22 builds no arm64;
            #     the runner runs them
            #   tool_dir_test N/A the installed tools: the native suite is handed none; the installed suite runs it
            #   wrapper_test SKIP rename_segment: ld64.lld writes no LC_LAZY_LOAD_DYLIB, so no host runs it
            row_allowed() {
              case "$1" in
                "bake_mavericks_shim_test: N/A signed"|"codesign_order_test: N/A resign 10.9 against the oracle") ;;
                "insert_dylib_test: SKIP --strip-codesig"|"insert_dylib_test: SKIP no tty, no --all-yes") ;;
                "fixture_toolchain_test: N/A positive control against abe8d68") ;;
                "fixture_toolchain_test: N/A positive control against c7c0f56") ;;
                "objc_report: SKIP no x86_64 slice"|"symbol_rename_test: SKIP arm64") ;;
                "tool_dir_test: N/A the installed tools"|"wrapper_test: SKIP rename_segment") ;;
                *) return 1 ;;
              esac
            }
            suite() {  # NAME [VAR=VALUE...]: the suite, in the environment given
              name=$1; shift
              log="$TMPDIR/ctest-$name.log" status=0
              env DRYDOCK_REQUIRE_EXEC=x86_64 "$@" shipyard-ctest --preset native -LE not-in-guest --output-on-failure > "$log" 2>&1 || status=$?
              cat "$log"
              [ "$status" -eq 0 ] || { echo "the guest's $name suite failed (ctest exited $status)"; return 1; }
              sed -n '/did not run:/,$s/^[[:space:]]*[0-9]* - \([^ ]*\) (.*/\1/p' "$log" > "$TMPDIR/skipped"
              # The positive control: no Intel Mac runs arm64, so a parse that misses this has missed them all.
              grep -qx apple_silicon_signing_test "$TMPDIR/skipped" \
                || { echo "the $name suite's did-not-run list does not name apple_silicon_signing_test: has ctest's output changed?"; return 1; }
              while read -r t; do
                want="$(why "$t")" || { echo "$t did not run, and the guest allows that only of x86len_oracle_test, rebase_oracle_test, apple_silicon_signing_test and macfuse_golden_test"; return 1; }
                said="$(awk -v t="$t" '$0 ~ "^[0-9]+/[0-9]+ Test: " t "$" { f = 1; next } f && /^<end of output>$/ { exit } f && /^SKIP/ { s = $0 } END { print s }' "$NATIVE/Testing/Temporary/LastTest.log")"
                case "$said" in "$want"*) echo "did not run, as allowed: $t ($said)" ;;
                  *) echo "$t did not run, saying '${said:-nothing}', not '$want'"; return 1 ;; esac
              done < "$TMPDIR/skipped"
              awk '/^[0-9]+\/[0-9]+ Test: / { t = $3; next } /^<end of output>$/ { t = "" }
                t != "" && /^(SKIP|N\/A) / { r = $0; sub(/: .*/, "", r); print t ": " r }' \
                "$NATIVE/Testing/Temporary/LastTest.log" | sort -u > "$TMPDIR/rows"
              # The positive control: the native clang22 builds no arm64, so a parse that misses this row has missed them all.
              grep -qx 'symbol_rename_test: SKIP arm64' "$TMPDIR/rows" \
                || { echo "the $name suite's rows do not include symbol_rename_test's SKIP arm64: has LastTest.log changed?"; return 1; }
              while IFS= read -r r; do
                row_allowed "$r" || { echo "$r: a row did not run, and the guest does not allow that"; return 1; }
                echo "row did not run, as allowed: $r"
              done < "$TMPDIR/rows"
            }
            must suite native
            # The installed tools: the suites are handed them, with this build's fixture helpers (tool_dir_test).
            shipyard-cmake --preset native -DDRYDOCK_TOOL_DIR="$INSTALLED"
            shipyard-cmake --build --preset native
            must suite installed DRYDOCK_TOOL_DIR="$INSTALLED"
            must sh tests/characterize.sh "$NATIVE" check
            must sh tests/characterize.sh "$INSTALLED" check
            must sh tests/equivalence.sh produce "$INSTALLED" eq/inputs out/macos-x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: drydock-equivalence-x86_64
          path: out/macos-x86_64

  # The arm64 slice's acceptance (INGREDIENTS.md's arm64: deviation), on Apple Silicon: it installs the
  # .pkg build made on Linux and runs every tool it ships, runs the standalone archive's tools, builds the
  # cross-arm64 preset with clang22 for the suite's fixtures and helpers and runs the suite on the installed
  # tools (DRYDOCK_TOOL_DIR) with DRYDOCK_REQUIRE_EXEC=arm64, so a row that would skip arm64 fails. A test
  # that does not run fails the job unless the allow-list below names it and its last SKIP line gives the
  # reason the list states; any other row that says SKIP or N/A fails it unless a second allow-list allows
  # it. Then the arm64 checks run on the installed tools, each failing the job on a 77, and it makes
  # equivalence's macos-arm64 outputs. Nothing here packages; the Rosetta snapshot and check bracket it all.
  modern-smoke:
    needs: [build]
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      # Rosetta writes a translation under /var/db/oah for each x86_64 binary it runs, so a file that appears
      # there between this step and this job's last is something the job ran translated. The last step names it.
      - name: Snapshot Rosetta's translations, before this job runs anything
        run: |
          set -eu
          sudo -n true || { echo "::error::sudo needs a password here, so /var/db/oah cannot be read"; exit 1; }
          if ! sudo test -d /var/db/oah; then
            echo "no /var/db/oah: Rosetta is not installed, so nothing this job runs can run translated"
            : > "$RUNNER_TEMP/oah-absent"
            exit 0
          fi
          sudo find /var/db/oah/ -type f > "$RUNNER_TEMP/oah.raw"
          LC_ALL=C sort "$RUNNER_TEMP/oah.raw" > "$RUNNER_TEMP/oah-before"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the suite's git checks read history
          persist-credentials: false

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      - uses: actions/download-artifact@v8
        with:
          name: drydock
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: drydock-equivalence
          path: eq

      - name: Install the pkg, and run its arm64 tools
        run: |
          set -eu
          [ "$(uname -m)" = arm64 ] && [ "$(arch)" = arm64 ] || { echo "::error::this runner is not running arm64 natively"; exit 1; }
          V='${{ needs.build.outputs.version }}'
          sudo installer -pkg "dist/drydock-$V.pkg" -target /
          got="$(/usr/libexec/PlistBuddy -c 'Print :version' /usr/local/mavergreen/drydock/mavergreen.plist)"
          [ "$got" = "$V" ] || { echo "::error::the installed manifest says version $got, not $V"; exit 1; }
          for f in /usr/local/mavergreen/drydock/bin/*; do
            rc=0; "$f" < /dev/null > "$RUNNER_TEMP/bare.out" 2>&1 || rc=$?
            case "$rc" in 1|2) [ -s "$RUNNER_TEMP/bare.out" ] || { echo "::error::$f exited $rc saying nothing"; exit 1; } ;;
              *) cat "$RUNNER_TEMP/bare.out"; echo "::error::$f, run bare, exited $rc"; exit 1 ;; esac
            echo "ran $f ($rc, its usage)"
          done
          /usr/local/mavergreen/drydock/bin/drydock-macho-rewrite --capabilities > /dev/null
          OBJC=/usr/local/mavergreen/drydock/bin/drydock-objc
          archs="$(lipo -info "$OBJC" | sed -n 's/.*: //p')"
          case " $archs " in *" arm64 "*) ;; *) echo "::error::$OBJC carries $archs, no arm64"; exit 1 ;; esac
          rc=0; "$OBJC" < /dev/null > "$RUNNER_TEMP/bare.out" 2>&1 || rc=$?
          [ "$rc" -eq 2 ] && grep -q '^usage: drydock-objc' "$RUNNER_TEMP/bare.out" || { cat "$RUNNER_TEMP/bare.out"; echo "::error::$OBJC, run bare, exited $rc"; exit 1; }
          digest="$("$OBJC" evidence --tree-digest-only --source-root tests/objc/fixtures)"
          . tests/lib/tree-digest.sh && want="$(tree_digest tests/objc/fixtures)"
          [ -n "$want" ] || { echo "::error::tree_digest gave no digest for tests/objc/fixtures"; exit 1; }
          [ "$digest" = "$want" ] || { echo "::error::evidence --tree-digest-only gave '$digest', the algorithm gives $want"; exit 1; }
          echo "drydock-objc $V ($archs) ran natively; tests/objc/fixtures digests to $digest"

      - name: The standalone archive is the package's tree, and runs from anywhere
        run: |
          V='${{ needs.build.outputs.version }}'
          sh tests/standalone_archive_test.sh "dist/drydock-$V-macos-universal.tar.gz" "dist/drydock-$V.pkg"

      # macfuse_golden_test's input: upstream's debug tarball, pinned by sha256, outside the source tree
      # (and in $HOME, not runner.temp, whose path a container job sees differently).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/macfuse-debug
          key: macfuse-debug-${{ hashFiles('components/macfuse-debug/sha256') }}

      - name: Fetch and verify macFUSE's debug tarball, for macfuse_golden_test
        run: |
          set -eu
          v="$(tr -d '[:space:]' < components/macfuse-debug/version)"
          tbz="$HOME/.cache/macfuse-debug/macfuse-$v-debug.tbz"
          mkdir -p "$(dirname "$tbz")"
          [ -f "$tbz" ] || curl -fsSL -o "$tbz" "https://github.com/macfuse/macfuse/releases/download/macfuse-$v/macfuse-$v-debug.tbz"
          echo "$(tr -d '[:space:]' < components/macfuse-debug/sha256)  $tbz" | shasum -a 256 -c
          echo "MACFUSE_DEBUG_TBZ=$tbz" >> "$GITHUB_ENV"

      # The tools under test are the installed ones; this build makes the suite's fixtures and helpers, with
      # clang22 named as the guest names it, so nothing here is built by a compiler the shipped tools are not.
      - name: Configure + build cross-arm64 with clang22, handing the suite the installed tools
        run: |
          set -eu
          CLANG22="$(sh "$SHIPYARD_SCRIPTS/fetch_clang22.sh" "$SHIPYARD_SCRIPTS/../components/clang22")"
          shipyard-cmake --preset cross-arm64 -DMAVERICKS_REQUIRE_APPLECLANG=OFF -DCMAKE_C_COMPILER="$CLANG22/bin/clang" \
            -DCMAKE_AR="$CLANG22/bin/llvm-ar" -DCMAKE_RANLIB="$CLANG22/bin/llvm-ranlib" \
            -DCMAKE_INSTALL_NAME_TOOL="$CLANG22/bin/llvm-install-name-tool" -DDRYDOCK_CLANG22="$CLANG22" \
            -DDRYDOCK_TOOL_DIR=/usr/local/mavergreen/drydock/bin
          shipyard-cmake --build --preset cross-arm64

      - name: Run the repo's tests (arm64) on the installed tools
        run: |
          set -eu
          ARM64="${TMPDIR:-/tmp}/mm-build/$(basename "$PWD")-cross-arm64"
          # Allowed not to run here, each only for the reason its last SKIP line must give (a glob):
          #   resources_instantiate: it instantiates nibs with 10.9's AppKit; on-target's maintainer runs it
          #   objc_attest_codex: its input is codex's kept repro in one maintainer's ~/Library/Caches
          #   objc_reference_set: a maintainer test; this runner refuses its arm64 dylib in an arm64e process
          #   objc_iterm2_acceptance: a maintainer test, on a cached upstream iTerm2
          #   codesign_order_test: its oracle is cctools-862's codesign_allocate, which Xcode 26 does not ship
          #   raise_corpus_test: its corpus is 10.9's /usr/lib, which macOS 26 keeps in the shared cache
          #   raise_oracle_counts_test: the same corpus
          #   hdrref_table_rule_test: the same corpus, x86_64 slices; on-target runs all three
          #   raise_runs_test: it raises and runs 10.9's own libraries and programs
          #   mantle_raise_test: its subject is an app in one maintainer's ~/Downloads
          #   legacysupport_rename_test: MacPorts' library is x86_64 for 10.9; on-target hands it over and runs it
          #   x86len_oracle_test: its oracle is cctools' otool, not Xcode's llvm-otool, over 10.9's images
          #   rebase_oracle_test: its oracle is dyldinfo, which Xcode no longer ships, over 10.9's corpus
          why() {
            case "$1" in
              resources_instantiate) echo "SKIP resources_instantiate: AppKit on 10.9" ;;
              objc_attest_codex) echo "SKIP objc_attest_codex: */Library/Caches/mm-build/codex-native-sweep-repro is absent" ;;
              objc_reference_set) echo "SKIP objc_reference_set: a maintainer test -- it runs on 10.9, or here with DRYDOCK_OBJC_MAINTAINER=1" ;;
              objc_iterm2_acceptance) echo "SKIP objc_iterm2_acceptance: a maintainer test -- it runs on 10.9, or here with DRYDOCK_OBJC_MAINTAINER=1" ;;
              codesign_order_test) echo "SKIP: * is not cctools-862's, whose verdicts this test pins" ;;
              raise_corpus_test) echo "SKIP: /usr/lib holds no dylibs here; the corpus is 10.9's own" ;;
              raise_oracle_counts_test) echo "SKIP: /usr/lib holds no dylibs here; the corpus is 10.9's own" ;;
              hdrref_table_rule_test) echo "SKIP: /usr/lib holds no dylibs here; the corpus is 10.9's own" ;;
              raise_runs_test) echo "SKIP: these are 10.9's libraries and programs; this is not 10.9" ;;
              mantle_raise_test) echo "SKIP: */Downloads/OpenCode.app/Contents/Frameworks/Mantle.framework/Versions/A/Mantle is absent" ;;
              legacysupport_rename_test) echo "SKIP: legacysupport_rename_test: no libMacportsLegacySupport.a (set LEGACYSUPPORT_A)" ;;
              x86len_oracle_test) echo "SKIP: * is not cctools' otool, whose linear sweep is the oracle: *"
                echo "SKIP: * is absent; the corpus is 10.9's own images" ;;
              rebase_oracle_test) echo "SKIP: no dyldinfo here: *"
                echo "SKIP: /usr/lib holds no dylibs here; the corpus is 10.9's own" ;;
              *) return 1 ;;
            esac
          }
          # Rows of tests that ran, allowed to say SKIP here, by their whole line, for the reason given:
          #   any x86_64 row: no Rosetta by policy; on-target runs them all
          #   a (libgmalloc) row, and cli_test's under libgmalloc: macOS 26 may keep no libgmalloc.dylib on disk; 10.9 runs them
          #   grown_binary_runs_test's system: /usr/bin/printf is fat with chained fixups here; 10.9's qualifies
          #   wrapper_test's rename_segment LC_LAZY_LOAD_DYLIB: ld64.lld writes none, so no host runs it
          row_allowed() {
            case "$1" in
              *": SKIP "*": cannot execute x86_64 on this host (Apple Silicon, no Rosetta by policy)") ;;
              *": SKIP "*" (libgmalloc): no /usr/lib/libgmalloc.dylib on this host") ;;
              "cli_test: SKIP order: short load commands under libgmalloc: libgmalloc does not load here") ;;
              "grown_binary_runs_test: SKIP system: /usr/bin/printf: does not qualify here: "*) ;;
              "wrapper_test: SKIP rename_segment: LC_LAZY_LOAD_DYLIB classification: "*) ;;
              *) return 1 ;;
            esac
          }
          log="$RUNNER_TEMP/ctest.log" status=0
          DRYDOCK_REQUIRE_EXEC=arm64 sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh" cross-arm64 > "$log" 2>&1 || status=$?
          cat "$log"
          [ "$status" -eq 0 ] || { echo "::error::the arm64 suite failed (ctest exited $status)"; exit 1; }
          sed -n '/did not run:/,$s/^[[:space:]]*[0-9]* - \([^ ]*\) (.*/\1/p' "$log" > "$RUNNER_TEMP/skipped"
          # The positive control: only 10.9 runs raise_runs_test, so a parse that misses it has missed them all.
          grep -qx raise_runs_test "$RUNNER_TEMP/skipped" \
            || { echo "::error::the did-not-run list does not name raise_runs_test: has ctest's output changed?"; exit 1; }
          while read -r t; do
            want="$(why "$t")" || { echo "::error::$t did not run, and the runner does not allow that"; exit 1; }
            said="$(awk -v t="$t" '$0 ~ "^[0-9]+/[0-9]+ Test: " t "$" { f = 1; next } f && /^<end of output>$/ { exit } f && /^SKIP/ { s = $0 } END { print s }' "$ARM64/Testing/Temporary/LastTest.log")"
            printf '%s\n' "$want" | { while IFS= read -r p; do case "$said" in $p) exit 0 ;; esac; done; exit 1; } \
              || { echo "::error::$t did not run, saying '${said:-nothing}', not '$want'"; exit 1; }
            echo "did not run, as allowed: $t ($said)"
          done < "$RUNNER_TEMP/skipped"
          awk 'NR == FNR { skipped[$0] = 1; next } /^[0-9]+\/[0-9]+ Test: / { t = ($3 in skipped) ? "" : $3; next }
            /^<end of output>$/ { t = "" } t != "" && /^(SKIP|N\/A) / { print t ": " $0 }' \
            "$RUNNER_TEMP/skipped" "$ARM64/Testing/Temporary/LastTest.log" | sort -u > "$RUNNER_TEMP/rows"
          # The positive control: no arm64 Mac runs x86_64, so a parse that misses this row has missed them all.
          grep -qxF 'symbol_rename_test: SKIP forwarding: links and prints 43: cannot execute x86_64 on this host (Apple Silicon, no Rosetta by policy)' "$RUNNER_TEMP/rows" \
            || { echo "::error::the rows do not include symbol_rename_test's x86_64 forwarding row: has LastTest.log changed?"; exit 1; }
          while IFS= read -r r; do
            row_allowed "$r" || { echo "::error::$r: a row did not run, and the runner does not allow that"; exit 1; }
            echo "row did not run, as allowed: $r"
          done < "$RUNNER_TEMP/rows"

      # Run separately as well as under ctest. ctest hides a skipped test's output, so a SKIP here would be
      # indistinguishable from a pass -- exactly the silent no-op this test exists to avoid. On a modern runner
      # it must actually run; a skip is a failure of the check, not of the tools.
      - name: Cover patch_macho's chained-fixups conversion (arm64, installed)
        run: |
          set -eu
          sh tests/chained-fixups.sh /usr/local/mavergreen/drydock/bin && rc=0 || rc=$?
          if [ "$rc" = 77 ]; then
            echo "::error::chained-fixups SKIPPED on a modern runner — it should be able to emit them"
            exit 1
          fi
          exit "$rc"

      # The same reasoning as chained-fixups above: this runner is the arm64 Mac
      # the test needs, so a SKIP here means it measured nothing.
      - name: Edited outputs on Apple Silicon (strip or re-sign, by arch; installed arm64 Drydock)
        run: |
          set -eu
          sh tests/apple_silicon_signing_test.sh /usr/local/mavergreen/drydock/bin && rc=0 || rc=$?
          if [ "$rc" = 77 ]; then
            echo "::error::apple_silicon_signing_test SKIPPED on the arm64 runner -- it should run here"
            exit 1
          fi
          exit "$rc"

      # The same again: this job fetched the tarball, so a SKIP means the golden went unchecked.
      - name: macFUSE 5.5.0's kext, through vnodeop replace, is the golden one (installed arm64 Drydock)
        run: |
          set -eu
          sh tests/macfuse_golden_test.sh /usr/local/mavergreen/drydock/bin && rc=0 || rc=$?
          if [ "$rc" = 77 ]; then
            echo "::error::macfuse_golden_test SKIPPED on the arm64 runner -- it should run here"
            exit 1
          fi
          exit "$rc"

      # tests/EXPECTED was recorded from a native build on real 10.9 hardware; matching digests are the
      # claim "cross ≡ native" made checkable, here for the installed arm64 slice.
      - name: Prove build equivalence against the native 10.9 reference (installed arm64)
        run: |
          set -eu
          echo "reference digest (recorded natively on 10.9): $(cat tests/EXPECTED)"
          sh tests/characterize.sh /usr/local/mavergreen/drydock/bin check

      - name: Equivalence's macos-arm64 outputs, from the installed tools
        run: sh tests/equivalence.sh produce /usr/local/mavergreen/drydock/bin eq/inputs "$RUNNER_TEMP/macos-arm64"

      - uses: actions/upload-artifact@v7
        with:
          name: drydock-equivalence-arm64
          path: ${{ runner.temp }}/macos-arm64

      - name: Nothing this job ran was translated by Rosetta
        if: always()
        run: |
          set -eu
          if [ -f "$RUNNER_TEMP/oah-absent" ]; then
            ! sudo test -d /var/db/oah || { echo "::error::/var/db/oah appeared during this job"; exit 1; }
            echo "no /var/db/oah: Rosetta is not installed, so nothing this job ran ran translated"
            exit 0
          fi
          [ -f "$RUNNER_TEMP/oah-before" ] || { echo "::error::no snapshot of /var/db/oah was taken before this job ran anything"; exit 1; }
          sudo find /var/db/oah/ -type f > "$RUNNER_TEMP/oah.raw"
          LC_ALL=C sort "$RUNNER_TEMP/oah.raw" > "$RUNNER_TEMP/oah-after"
          LC_ALL=C comm -13 "$RUNNER_TEMP/oah-before" "$RUNNER_TEMP/oah-after" > "$RUNNER_TEMP/oah-new"
          if [ -s "$RUNNER_TEMP/oah-new" ]; then
            while IFS= read -r f; do echo "::error::Rosetta translated $f during this job"; done < "$RUNNER_TEMP/oah-new"
            exit 1
          fi
          echo "/var/db/oah gained nothing: this job ran no x86_64 code"

  equivalence:
    name: equivalence (linux-x86_64 against macOS)
    needs: [build, linux, on-target, modern-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: drydock-equivalence
          path: ${{ runner.temp }}/equivalence

      - uses: actions/download-artifact@v8
        with:
          name: drydock-equivalence-arm64
          path: ${{ runner.temp }}/equivalence/macos-arm64

      - uses: actions/download-artifact@v8
        with:
          name: drydock-equivalence-x86_64
          path: ${{ runner.temp }}/equivalence/macos-x86_64

      - uses: actions/download-artifact@v8
        with:
          name: drydock-linux
          path: ${{ runner.temp }}/linux

      - uses: actions/download-artifact@v8
        with:
          name: drydock
          path: ${{ runner.temp }}/macos

      - name: The Linux drydock-macho-rewrite and both macOS slices make the same files, byte for byte
        run: |
          set -eu
          V='${{ needs.build.outputs.version }}'
          EQ="$RUNNER_TEMP/equivalence"
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP/linux/drydock-$V-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/unpacked"
          sh tests/equivalence.sh produce "$RUNNER_TEMP/unpacked/drydock-$V/bin" "$EQ/inputs" "$EQ/linux-x86_64"
          sh tests/equivalence.sh compare "$EQ/macos-x86_64" "$EQ/macos-arm64"
          sh tests/equivalence.sh compare "$EQ/macos-x86_64" "$EQ/linux-x86_64"
          sh tests/equivalence.sh compare "$EQ/macos-arm64" "$EQ/linux-x86_64"

      - name: The Linux archive holds the macOS archive's tree
        run: |
          V='${{ needs.build.outputs.version }}'
          sh tests/linux_archive_test.sh "$RUNNER_TEMP/linux/drydock-$V-linux-x86_64.tar.gz" \
            "$RUNNER_TEMP/macos/drydock-$V-macos-universal.tar.gz"

  assemble:
    needs: [build, linux, equivalence]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: drydock
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: drydock-linux
          path: dist

      - name: Every asset is there
        run: |
          set -eu
          V='${{ needs.build.outputs.version }}'
          for f in "drydock-$V.pkg" "drydock-$V-macos-universal.tar.gz" "drydock-$V-linux-x86_64.tar.gz" \
                   build-info-linux-x86_64.txt drydock.xml RELEASE_NOTES.md; do
            [ -s "dist/$f" ] || { echo "::error::dist/$f is missing"; exit 1; }
          done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: drydock-release
          path: dist/*

  # Proves this run's logs and files carry no piece of the signing key, before anything
  # publishes; always(), so a run that failed after signing is scanned too.
  scan:
    needs: [build, assemble]
    if: always() && (needs.build.outputs.publish == 'yes')
    permissions:
      actions: read
      contents: read
    uses: Mavergreen/shipyard/.github/workflows/scan-for-key.yml@v1
    with:
      artifact: 'drydock*'
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  # The only writer to Releases, and only a dispatch on main reaches it: nothing else sets release=yes.
  # The shared workflow regenerates SHA256SUMS, uses RELEASE_NOTES.md from the artifact as the
  # Release body, and fails if those notes are missing or empty.
  publish:
    needs: [build, linux, on-target, modern-smoke, equivalence, assemble, scan]
    if: needs.build.outputs.publish == 'yes'
    permissions:
      contents: write
    uses: Mavergreen/shipyard/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.build.outputs.tag }}
      artifact: drydock-release

  required:
    name: required (release)
    if: always()
    needs: [build, linux, on-target, modern-smoke, equivalence, assemble, scan, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: Mavergreen/shipyard/.github/actions/required-gate@v1
        with:
          needs: ${{ toJSON(needs) }}
